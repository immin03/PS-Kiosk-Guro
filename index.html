<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
  <meta name="theme-color" content="#FFFFFF" />
  <title>파마스퀘어 익스프레스 구로점</title>
  <style>
    /* 글꼴을 직접 싣습니다. 전에는 CDN(jsdelivr) 에서 받아서, 매장 인터넷이
       느리거나 끊기면 글자가 늦게 뜨거나 다른 글꼴로 나왔습니다.
       주소는 상대경로라 /guro/ 처럼 하위 경로에 올려도 맞습니다.
       보이미 전달본(2026-09-18) 의 서브셋입니다. */
    @font-face{
      font-family:"Pretendard";
      src:url("./assets/fonts/Pretendard-Variable.subset.woff2") format("woff2-variations");
      font-weight:100 900;
      font-display:swap;
    }
    html,body,#root{width:100%;height:100%;margin:0}
    .kiosk-input::placeholder{font-weight:400}
    body{background:#FFFFFF;font-family:Pretendard,"Pretendard Variable",-apple-system,"Noto Sans KR",sans-serif}
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    /* 터치로 누를 때 생기는 테두리를 없앱니다. 안드로이드 뷰어는 이것을
       노란 선으로 그려서, 손님이 누를 때마다 화면에 줄이 그어졌습니다.
       키보드로 짚어 갈 때(:focus-visible)는 그대로 보여 줍니다 — 매장에서는
       쓸 일이 없지만 없애 두면 키보드로 쓰는 사람이 지금 어디인지 잃습니다. */
    :focus{outline:none}
    :focus:not(:focus-visible){outline:none;box-shadow:none}
    :focus-visible{outline:2px solid #2BCAB0;outline-offset:2px}
    button,input{font:inherit}
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
